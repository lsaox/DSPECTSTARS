<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Thank You | DSPECTSTARS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(75, 110, 255, 0.14),
          transparent 32rem
        ),
        #05070d;

      color: #fff;

      font-family: "Inter", sans-serif;
    }


    .thank-you {
      width: min(720px, 100%);

      text-align: center;
    }


    .eyebrow {
      display: block;

      margin-bottom: 22px;

      color: #80a7ff;

      font-size: 0.72rem;
      font-weight: 700;

      letter-spacing: 0.32em;

      text-transform: uppercase;
    }


    h1 {
      margin-bottom: 24px;

      font-family: "Orbitron", sans-serif;

      font-size: clamp(3rem, 8vw, 6rem);

      font-weight: 500;

      line-height: 0.98;

      letter-spacing: -0.055em;
    }


    p {
      max-width: 570px;

      margin: 0 auto;

      color: rgba(255, 255, 255, 0.60);

      font-size: 1rem;

      line-height: 1.75;
    }


    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 220px;

      margin-top: 38px;

      padding: 18px 28px;

      border-radius: 999px;

      background: #fff;

      color: #080b12;

      font-family: "Orbitron", sans-serif;

      font-size: 0.72rem;
      font-weight: 700;

      letter-spacing: 0.15em;

      text-decoration: none;
      text-transform: uppercase;

      transition: 0.25s ease;
    }


    .button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 18px 45px
        rgba(100, 137, 255, 0.22);
    }


    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      h1 {
        font-size: clamp(2.7rem, 13vw, 4.2rem);
      }

      p {
        font-size: 0.95rem;
      }

      .button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <main class="thank-you">

    <span class="eyebrow">
      Request Received
    </span>

    <h1>
      Thank You.
    </h1>

    <p>
      We received your request. Our team will review your vehicle
      information and the services you're interested in and get back
      to you shortly.
    </p>

    <a href="/" class="button">
      Back to Home
    </a>

  </main>

</body>

</html>
